<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobIntel Pro Suite - Complete ATS Recruitment Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    @media print {
      body * { visibility: hidden; }
      #printable-offer-letter, #printable-offer-letter * { visibility: visible; }
      #printable-offer-letter {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        background: white !important;
        color: black !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="app"></div>

  <script>
    const isStudio = window.location.pathname.includes('interview-studio');

    function getStudent() {
      const saved = localStorage.getItem('jobintel_student');
      return saved ? JSON.parse(saved) : null;
    }

    function saveStudent(profile) {
      localStorage.setItem('jobintel_student', JSON.stringify(profile));
    }

    function logoutStudent() {
      localStorage.removeItem('jobintel_student');
      location.reload();
    }

    if (isStudio) {
      renderStudio();
    } else {
      const student = getStudent();
      if (!student) {
        renderAuthModal();
      } else {
        renderDashboard(student);
      }
    }

    // ==========================================
    // 0. STUDENT ONBOARDING / LOGIN SCREEN
    // ==========================================
    function renderAuthModal() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-950/40 via-slate-950 to-black">
          <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur-xl">
            <div class="flex items-center gap-3 mb-6">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center font-bold font-mono text-white text-xl shadow-lg shadow-blue-500/30">
                JI
              </div>
              <div>
                <h1 class="text-lg font-bold text-slate-100">JobIntel Candidate Portal</h1>
                <p class="text-xs text-slate-400">Student Sign-In & Verification</p>
              </div>
            </div>

            <p class="text-xs text-slate-300 mb-6 leading-relaxed">
              Welcome! Register your profile to apply for active engineering roles, run ATS resume diagnostics, and unlock live proctored AI technical assessments.
            </p>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
              <div>
                <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Full Legal Name</label>
                <input id="auth-name" type="text" required placeholder="e.g. John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500" />
              </div>

              <div>
                <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Email Address</label>
                <input id="auth-email" type="email" required placeholder="e.g. student@university.edu" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500" />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">University / College</label>
                  <input id="auth-college" type="text" required placeholder="e.g. Engineering Institute" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Graduation Year</label>
                  <input id="auth-year" type="text" required placeholder="e.g. 2026 or 2027" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500" />
                </div>
              </div>

              <div>
                <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Target Role</label>
                <select id="auth-role" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
                  <option value="Software Development Engineer (Full Stack)">Software Development Engineer (Full Stack)</option>
                  <option value="Backend Systems Engineer">Backend Systems Engineer</option>
                  <option value="Cloud Infrastructure Engineer">Cloud Infrastructure Engineer</option>
                  <option value="Frontend Developer">Frontend Developer</option>
                </select>
              </div>

              <button type="submit" class="w-full mt-4 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-bold uppercase tracking-wider shadow-lg shadow-blue-500/20 transition-all cursor-pointer">
                Enter Candidate Portal ➔
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('auth-name').value.trim();
      const email = document.getElementById('auth-email').value.trim();
      const college = document.getElementById('auth-college').value.trim();
      const year = document.getElementById('auth-year').value.trim();
      const role = document.getElementById('auth-role').value;

      const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'ST';

      saveStudent({ name, email, college, year, role, initials });
      location.reload();
    }

    // ==========================================
    // 1. MAIN DASHBOARD VIEW
    // ==========================================
    function renderDashboard(student) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          <header class="h-16 border-b border-slate-800 bg-slate-900/90 px-8 flex items-center justify-between sticky top-0 z-50 backdrop-blur-md">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-bold font-mono text-white text-lg shadow-md shadow-blue-500/30">
                JI
              </div>
              <div>
                <h1 class="font-bold text-base text-slate-100 flex items-center gap-2">
                  JobIntel Pro Suite <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800">Recruitment Ecosystem</span>
                </h1>
                <p class="text-xs text-slate-400">Jobs Apply • ATS Scanner • Resume Builder • Kanban Pipeline • AI Interview Studio</p>
              </div>
            </div>

            <div class="flex items-center gap-4">
              <div class="text-right">
                <div class="text-xs font-semibold text-slate-200">${student.name}</div>
                <div class="text-[11px] text-emerald-400 font-mono">${student.college} • Class of '${student.year.slice(-2)}</div>
              </div>
              <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-blue-400">
                ${student.initials}
              </div>
              <button onclick="logoutStudent()" title="Sign Out / Switch Student" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 transition-colors text-xs cursor-pointer">
                🚪
              </button>
            </div>
          </header>

          <nav class="border-b border-slate-800 bg-slate-900/40 px-8 flex gap-6 text-xs font-medium uppercase tracking-wider">
            <button onclick="switchTab('jobs')" id="tab-jobs" class="py-3.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all cursor-pointer">
              💼 Verified Jobs
            </button>
            <button onclick="switchTab('pipeline')" id="tab-pipeline" class="py-3.5 border-b-2 border-blue-500 text-blue-400 font-bold transition-all cursor-pointer">
              📌 Recruitment Lifecycle (6 Stages)
            </button>
            <button onclick="switchTab('ats')" id="tab-ats" class="py-3.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all cursor-pointer">
              📊 ATS Resume Checker
            </button>
            <button onclick="switchTab('maker')" id="tab-maker" class="py-3.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all cursor-pointer">
              📝 ATS Resume Maker
            </button>
          </nav>

          <main id="content" class="flex-1 p-8"></main>
          <div id="modal-container"></div>
        </div>
      `;

      window.addEventListener('message', async (event) => {
        if (event.data?.type === 'JOBINTEL_INTERVIEW_COMPLETE') {
          const { score, summary } = event.data.payload;
          const candidateId = event.data.candidateId || 'app-1';
          await fetch('/api/pipeline/update-stage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              candidateId: candidateId,
              stage: 'System Design',
              score: score,
              feedback: summary
            })
          });
          loadPipeline();
        }
      });

      switchTab('jobs');
    }

    function switchTab(tab) {
      ['jobs', 'pipeline', 'ats', 'maker'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        if (btn) {
          if (t === tab) {
            btn.className = 'py-3.5 border-b-2 border-blue-500 text-blue-400 font-bold transition-all cursor-pointer';
          } else {
            btn.className = 'py-3.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all cursor-pointer';
          }
        }
      });

      if (tab === 'jobs') loadJobs();
      if (tab === 'pipeline') loadPipeline();
      if (tab === 'ats') loadAts();
      if (tab === 'maker') loadMaker();
    }

    // --- TAB: JOBS ---
    async function loadJobs() {
      const container = document.getElementById('content');
      container.innerHTML = '<div class="text-center py-20 text-slate-500 font-mono text-sm">Loading verified jobs...</div>';

      try {
        const res = await fetch('/api/jobs');
        const jobs = await res.json();
        let html = `
          <div class="space-y-6">
            <div class="flex justify-between items-center pb-4 border-b border-slate-800">
              <div>
                <h2 class="text-xl font-bold text-slate-100">Verified Opportunities for New Applicants</h2>
                <p class="text-xs text-slate-400">Click Quick Apply to enter your application into the sequential hiring pipeline</p>
              </div>
              <span class="text-xs font-mono bg-blue-950 text-blue-400 border border-blue-800 px-3 py-1 rounded-full">
                ${jobs.length} Active Positions
              </span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        `;

        jobs.forEach(j => {
          html += `
            <div class="p-5 rounded-xl bg-slate-900/60 border border-slate-800 hover:border-slate-700 transition-all shadow-lg flex flex-col justify-between">
              <div>
                <div class="flex items-start justify-between">
                  <div>
                    <h3 class="font-bold text-slate-100 text-sm">${j.title}</h3>
                    <p class="text-xs text-blue-400 font-medium">${j.company} • ${j.location}</p>
                  </div>
                  <span class="text-[11px] font-mono text-emerald-400 font-bold bg-emerald-950/60 border border-emerald-800/40 px-2 py-0.5 rounded">
                    ${j.salary}
                  </span>
                </div>
                <p class="text-xs text-slate-400 my-3 leading-relaxed">${j.description}</p>
                <div class="flex flex-wrap gap-1.5 my-3">
                  ${j.required_skills.split(',').map(s => `<span class="text-[10px] font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">${s.trim()}</span>`).join('')}
                </div>
              </div>
              <button onclick="applyJob('${j.id}', '${j.company}', '${j.title}')" class="w-full mt-2 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-lg text-xs font-bold uppercase tracking-wider shadow-md transition-all cursor-pointer">
                1-Click Quick Apply ➔
              </button>
            </div>
          `;
        });

        html += '</div></div>';
        container.innerHTML = html;
      } catch(e) {
        container.innerHTML = '<div class="text-red-400 text-sm">Failed to load jobs.</div>';
      }
    }

    async function applyJob(jobId, company, role) {
      await fetch('/api/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobId, company, role, atsScore: 0 })
      });
      alert(`Applied to ${role} at ${company}! Added to your Recruitment Lifecycle.`);
      switchTab('pipeline');
    }

    // --- TAB: PIPELINE (WITH STRICT RECRUITMENT GATING & OFFER LETTER) ---
    async function loadPipeline() {
      const container = document.getElementById('content');
      container.innerHTML = '<div class="text-center py-20 text-slate-500 font-mono text-sm">Loading stages...</div>';

      try {
        const res = await fetch('/api/pipeline');
        const applications = await res.json();
        const stages = ['Applied', 'Resume Screening', 'Online Assessment (OA)', 'Technical Assessment', 'System Design', 'Offer Secured'];

        let html = `
          <div class="space-y-4">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
              <div>
                <h2 class="text-xl font-bold text-slate-100">Live Recruitment Lifecycle & ATS Pipeline</h2>
                <p class="text-xs text-slate-400">Sequential Hiring: Resume Screening ➔ OA Coding ➔ AI Technical Studio ➔ System Design ➔ Offer</p>
              </div>
              <button onclick="loadPipeline()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono text-slate-300 flex items-center gap-2 cursor-pointer transition-all">
                ↻ Refresh Stages
              </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-6 gap-3 overflow-x-auto min-w-[1250px]">
        `;

        stages.forEach(stage => {
          const cards = applications.filter(a => a.stage === stage);
          html += `
            <div class="bg-slate-900/60 rounded-xl border border-slate-800/80 p-3.5 flex flex-col min-h-[540px]">
              <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-300">${stage}</span>
                <span class="text-[10px] font-mono font-bold bg-slate-800 px-2 py-0.5 rounded text-blue-400">${cards.length}</span>
              </div>
              <div class="space-y-3 flex-1">
          `;

          if (cards.length === 0) {
            html += `<div class="h-32 flex items-center justify-center text-[11px] text-slate-600 font-mono border border-dashed border-slate-800/60 rounded-lg">No active candidates</div>`;
          }

          cards.forEach(c => {
            const isLowScore = c.ats_score > 0 && c.ats_score < 75;

            html += `
              <div class="p-3.5 rounded-lg bg-slate-950 border border-slate-800/90 shadow-md flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="text-xs font-bold text-slate-200">${c.company}</span>
                    ${c.ats_score > 0 ? `
                      <span class="text-[10px] font-mono px-1.5 py-0.5 rounded ${isLowScore ? 'bg-red-950/80 text-red-400 border border-red-800/50' : 'bg-emerald-950/80 text-emerald-400 border border-emerald-800/50'}">
                        ATS: ${c.ats_score}%
                      </span>
                    ` : ''}
                  </div>
                  <div class="text-[11px] text-slate-400 mb-2 font-medium">${c.role}</div>
                  <p class="text-[10px] text-slate-500 mb-2 leading-relaxed">${c.feedback || 'Application registered.'}</p>
                  ${c.interview_score > 0 ? `<div class="text-[10px] font-mono text-cyan-400 bg-cyan-950/40 p-1.5 rounded mb-2 border border-cyan-800/40">Interview Score: ${c.interview_score}/100</div>` : ''}
                </div>

                <div class="mt-2 space-y-1.5">
                  ${c.stage === 'Applied' ? `
                    <label class="w-full block text-center py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 text-[10px] font-bold uppercase rounded border border-dashed border-slate-700 cursor-pointer transition-all">
                      📁 Upload Resume File
                      <input type="file" accept=".pdf,.txt,.docx" class="hidden" onchange="handleFileUpload(event, '${c.id}')" />
                    </label>
                    <button onclick="runScreeningCheck('${c.id}', 90)" class="w-full py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-[10px] font-bold uppercase rounded transition-all cursor-pointer">
                      Run ATS Screening ➔
                    </button>
                  ` : ''}

                  ${c.stage === 'Resume Screening' && isLowScore ? `
                    <div class="p-2 rounded bg-red-950/40 border border-red-800/40 text-[10px] text-red-300 mb-1">
                      ⚠️ Score below 75% threshold. Automated filter rejected.
                    </div>
                    <button onclick="switchTab('maker')" class="w-full py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-[10px] font-bold uppercase rounded transition-all cursor-pointer">
                      🛠️ Rebuild in ATS Resume Maker ➔
                    </button>
                    <button onclick="runScreeningCheck('${c.id}', 92)" class="w-full py-1 bg-slate-800 hover:bg-slate-700 text-slate-400 text-[9px] uppercase rounded cursor-pointer">
                      Re-scan Updated Resume
                    </button>
                  ` : ''}

                  ${c.stage === 'Resume Screening' && !isLowScore ? `
                    <button onclick="advanceCandidate('${c.id}', 'Online Assessment (OA)', ${c.ats_score}, 'Screening Passed (Score: ${c.ats_score}%). Algorithmic Coding Assessment Link Dispatched.')" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold uppercase rounded transition-all cursor-pointer">
                      Pass ATS & Send OA ➔
                    </button>
                  ` : ''}

                  ${c.stage === 'Online Assessment (OA)' ? `
                    <button onclick="advanceCandidate('${c.id}', 'Technical Assessment', 95, 'Coding assessment completed with 100% test cases cleared. Qualified for AI Technical Studio.')" class="w-full py-1.5 bg-indigo-900/60 hover:bg-indigo-800 text-indigo-200 text-[10px] font-bold uppercase rounded border border-indigo-700 transition-all cursor-pointer">
                      Verify OA Score (95%) ➔
                    </button>
                  ` : ''}

                  ${c.stage === 'Technical Assessment' ? `
                    <button onclick="launchStudio('${c.id}')" class="w-full py-2 px-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-[11px] font-bold uppercase tracking-wider rounded-lg shadow-lg shadow-blue-500/20 flex items-center justify-center gap-1.5 transition-all cursor-pointer">
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                      Launch AI Studio 🚀
                    </button>
                  ` : ''}

                  ${c.stage === 'System Design' ? `
                    <button onclick="advanceCandidate('${c.id}', 'Offer Secured', 94, 'Passed System Design architectural drill-down. Formal employment offer generated.')" class="w-full py-1.5 bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 text-[10px] font-bold uppercase rounded border border-emerald-700 transition-all cursor-pointer">
                      Extend Job Offer 🏆
                    </button>
                  ` : ''}

                  ${c.stage === 'Offer Secured' ? `
                    <div class="space-y-1.5">
                      <div class="text-center py-1 text-emerald-400 font-mono text-[10px] font-bold bg-emerald-950/40 border border-emerald-800/40 rounded">
                        ✓ Offer Extended
                      </div>
                      <button onclick="openOfferLetterModal('${c.company}', '${c.role}', '${c.id}')" class="w-full py-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-[10px] font-bold uppercase tracking-wider rounded shadow-lg transition-all cursor-pointer flex items-center justify-center gap-1.5">
                        📜 View Offer Letter (PDF/DOC)
                      </button>
                    </div>
                  ` : ''}
                </div>
              </div>
            `;
          });

          html += `</div></div>`;
        });

        html += `</div></div>`;
        container.innerHTML = html;
      } catch(e) {
        container.innerHTML = '<div class="text-red-400 text-sm">Failed to load pipeline.</div>';
      }
    }

    function handleFileUpload(event, candidateId) {
      const file = event.target.files[0];
      if (!file) return;
      alert(`Resume "${file.name}" uploaded successfully! Running ATS Screening...`);
      runScreeningCheck(candidateId, 92);
    }

    async function runScreeningCheck(candidateId, score = 90) {
      const stage = 'Resume Screening';
      const feedback = score >= 75 
        ? `ATS Screening Passed (${score}% Match). Key competencies detected.`
        : `ATS Screening Failed (${score}% Match). Lacks required technical keywords.`;

      await fetch('/api/pipeline/update-stage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ candidateId, stage, score, feedback })
      });
      loadPipeline();
    }

    async function advanceCandidate(candidateId, nextStage, score, feedback) {
      await fetch('/api/pipeline/update-stage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ candidateId, stage: nextStage, score, feedback })
      });
      loadPipeline();
    }

    function launchStudio(candidateId) {
      const width = 1366;
      const height = 850;
      const left = Math.max(0, (window.screen.width - width) / 2);
      const top = Math.max(0, (window.screen.height - height) / 2);
      const features = `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no,location=no`;
      window.open('/interview-studio?candidateId=' + candidateId, 'JobIntelStudio', features);
    }

    // ==========================================
    // 2. FORMAL OFFER LETTER MODAL & EXPORT
    // ==========================================
    let activeOfferData = null;

    function openOfferLetterModal(company, role, appId) {
      const student = getStudent() || { name: 'Student Candidate', email: 'candidate@university.edu', college: 'Engineering Institute' };
      const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      const refNo = `JI-${company.substring(0,3).toUpperCase()}-${Math.floor(100000 + Math.random() * 900000)}`;

      activeOfferData = {
        company,
        role,
        studentName: student.name,
        studentEmail: student.email,
        studentCollege: student.college,
        refNo,
        date: today,
        salary: company.includes('Google') ? '₹32,00,000' : company.includes('Microsoft') ? '₹28,00,000' : '₹26,00,000',
        base: company.includes('Google') ? '₹22,00,000' : company.includes('Microsoft') ? '₹20,00,000' : '₹18,00,000',
        bonus: company.includes('Google') ? '₹4,00,000' : company.includes('Microsoft') ? '₹3,00,000' : '₹3,00,000',
        stocks: company.includes('Google') ? '₹6,00,000' : company.includes('Microsoft') ? '₹5,00,000' : '₹5,00,000'
      };

      const modalContainer = document.getElementById('modal-container');
      modalContainer.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md overflow-y-auto">
          <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden my-8">

    async function runAtsScan() {

                <span class="text-xs font-bold text-amber-300 uppercase tracking-wider block mb-2">Recommended Additions:</span>
                <div class="flex flex-wrap gap-1.5">
                  ${data.missingKeywords.map(kw => `<span class="text-[11px] font-mono px-2 py-0.5 rounded bg-amber-950/40 text-amber-300 border border-amber-800/40">+ ${kw}</span>`).join('')}

            ` : ''}
          </div>

      } finally {
        btn.innerText = 'Run ATS Compliance Audit 🔍';
        btn.disabled = false;
      }

                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Technical Architecture & Code Explanation</label>
                    <span class="text-[11px] text-slate-500 font-mono">Candidate Input</span>
                  </div>
                  <textarea id="studio-response" rows="4" placeholder="Explain architectural tradeoffs, WebRTC connection states, or database queries..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs focus:outline-none focus:border-cyan-500 resize-none text-slate-200 font-mono"></textarea>
                </div>
              </div>

              <div class="flex justify-between items-center mt-3">
                <span id="studio-status" class="text-[11px] text-slate-500">Ready to start verification</span>
                <button id="studio-submit-btn" style="display:none;" onclick="submitAnswer()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold tracking-wider transition-all cursor-pointer">
                  Submit Technical Answer ➔
                </button>
              </div>
            </section>

            <section class="col-span-5 p-5 flex flex-col bg-slate-900/20">
              <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">AI Assessment Panel</h2>
                <span id="speaker-indicator" style="display:none;" class="text-[11px] font-mono text-cyan-400 animate-pulse flex items-center gap-1">
                  <span>🔊</span> Interrogator Speaking...
                </span>
              </div>

              <div class="mt-4 p-4 rounded-xl border border-cyan-500/30 bg-cyan-950/20 shadow-lg">
                <div class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-1 font-mono">Active Challenge</div>
                <p id="billboard-q" class="text-sm font-medium text-slate-100 leading-relaxed">Click "Start Technical Session" below to initialize video stream and AI interrogator.</p>
              </div>

              <div id="transcript-box" class="flex-1 overflow-y-auto my-4 space-y-3 pr-2 scrollbar-thin"></div>

              <button id="start-session-btn" onclick="startTechnicalSession()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-xs uppercase tracking-wider shadow-lg shadow-blue-500/20 transition-all cursor-pointer">
                Start Technical Session
              </button>

              <div id="completed-box" style="display:none;" class="p-4 rounded-xl border border-emerald-500/40 bg-emerald-950/20 text-center">
                <div class="text-emerald-400 font-bold text-sm mb-1">Assessment Complete</div>
                <p class="text-xs text-slate-300 mb-3">Score: 92/100 • Advanced to System Design</p>
                <button onclick="window.close()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold cursor-pointer">
                  Close Studio & View Pipeline
                </button>
              </div>
            </section>
          </div>
        </div>
      `;

      initMedia();
    }

    async function initMedia() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720 },
          audio: true
        });
        studioStream = stream;
        const video = document.getElementById('studio-video');
        if (video) video.srcObject = stream;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        studioAudioContext = audioCtx;
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const canvas = document.getElementById('studio-waveform');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          const drawVisualizer = () => {
            studioAnimFrame = requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = (canvas.width / bufferLength) * 1.5;
            let x = 0;
            for (let i = 0; i < bufferLength; i++) {
              const barHeight = (dataArray[i] / 255) * canvas.height;
              ctx.fillStyle = '#06b6d4';
              ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
              x += barWidth;
            }
          };
          drawVisualizer();
        }
      } catch(err) {
        console.warn('Webcam/Mic hardware stream not connected or permission denied:', err);
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 0.95;
      const indicator = document.getElementById('speaker-indicator');
      utterance.onstart = () => { if (indicator) indicator.style.display = 'flex'; };
      utterance.onend = () => { if (indicator) indicator.style.display = 'none'; };
      utterance.onerror = () => { if (indicator) indicator.style.display = 'none'; };
      window.speechSynthesis.speak(utterance);
    }

    async function startTechnicalSession() {
      document.getElementById('start-session-btn').style.display = 'none';
      document.getElementById('studio-submit-btn').style.display = 'block';
      await fetchNextQuestion('');
    }

    async function fetchNextQuestion(userAnswer) {
      const status = document.getElementById('studio-status');
      status.innerText = `Question ${questionIndex + 1} evaluating...`;

      try {
        const res = await fetch('/api/interview/next-question', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ questionIndex, candidateAnswer: userAnswer })
        });
        const data = await res.json();

        if (data.isFinished) {
          document.getElementById('studio-submit-btn').style.display = 'none';
          document.getElementById('completed-box').style.display = 'block';
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              type: 'JOBINTEL_INTERVIEW_COMPLETE',
              payload: { score: data.finalScore, summary: data.evaluationSummary }
            }, '*');
          }
          return;
        }

        document.getElementById('billboard-q').innerText = data.question;
        const transcript = document.getElementById('transcript-box');
        if (userAnswer) {
          transcript.innerHTML += `
            <div class="p-3 rounded-lg text-xs leading-relaxed bg-blue-950/50 text-blue-200 border border-blue-900/60 ml-6">
              <div class="text-[9px] font-bold uppercase tracking-wider opacity-60 mb-1">Candidate</div>
              ${userAnswer}
            </div>
          `;
        }
        transcript.innerHTML += `
          <div class="p-3 rounded-lg text-xs leading-relaxed bg-slate-800/80 text-slate-200 border border-slate-700/60">
            <div class="text-[9px] font-bold uppercase tracking-wider opacity-60 mb-1">Autonomous AI Interrogator</div>
            ${data.question}
          </div>
        `;
        transcript.scrollTop = transcript.scrollHeight;

        questionIndex++;
        speakText(data.question);
        document.getElementById('studio-response').value = '';
        status.innerText = `Question ${questionIndex} active`;
      } catch(e) {
        console.error(e);
      }
    }

    function submitAnswer() {
      const answer = document.getElementById('studio-response').value.trim();
      if (!answer) return;
      fetchNextQuestion(answer);
    }
  </script>
</body>
</html>
