  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- TAB 1: JOB SEARCH & QUICK APPLY ---
    function JobBoardSection({ onApplySuccess }) {
      const [jobs, setJobs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [applyingId, setApplyingId] = useState(null);

      useEffect(() => {
        fetch('/api/jobs')
          .then(res => res.json())
          .then(data => { setJobs(data); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      const handleApply = async (job) => {
        setApplyingId(job.id);
        try {
          const res = await fetch('/api/apply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              jobId: job.id,
              company: job.company,
              role: job.title,
              atsScore: 92
            })
          });
          const data = await res.json();
          if (data.success) {
            alert(`Application submitted for ${job.title} at ${job.company}! Added to your Recruitment Pipeline.`);
            if (onApplySuccess) onApplySuccess();
          }
        } catch (e) {
          console.error(e);
        } finally {
          setApplyingId(null);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center pb-4 border-b border-slate-800">
            <div>
              <h2 className="text-xl font-bold text-slate-100">Verified SDE Opportunities</h2>
              <p className="text-xs text-slate-400">Direct 1-Click Applications linked directly with your JobIntel ATS Resume</p>
            </div>
            <span className="text-xs font-mono bg-blue-950 text-blue-400 border border-blue-800 px-3 py-1 rounded-full">
              {jobs.length} Active MNC Positions
            </span>
          </div>

          {loading ? (
            <div className="text-center py-20 text-slate-500 font-mono text-sm">Loading curated jobs...</div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {jobs.map((job) => (
                <div key={job.id} className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 hover:border-slate-700 transition-all shadow-lg flex flex-col justify-between">
                  <div>
                    <div className="flex items-start justify-between">
                      <div>
                        <h3 className="font-bold text-slate-100 text-sm">{job.title}</h3>
                        <p className="text-xs text-blue-400 font-medium">{job.company} • {job.location}</p>
                      </div>
                      <span className="text-[11px] font-mono text-emerald-400 font-bold bg-emerald-950/60 border border-emerald-800/40 px-2 py-0.5 rounded">
                        {job.salary}
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 my-3 leading-relaxed">{job.description}</p>
                    <div className="flex flex-wrap gap-1.5 my-3">
                      {job.required_skills.split(',').map((skill, i) => (
                        <span key={i} className="text-[10px] font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">
                          {skill.trim()}
                        </span>
                      ))}
                    </div>
                  </div>
                  <button
                    disabled={applyingId === job.id}
                    onClick={() => handleApply(job)}
                    className="w-full mt-2 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-50 text-white rounded-lg text-xs font-bold uppercase tracking-wider shadow-md transition-all cursor-pointer"
                  >
                    {applyingId === job.id ? 'Submitting Application...' : '1-Click Quick Apply ➔'}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- TAB 2: 5-STAGE RECRUITMENT PIPELINE ---
    function PipelineSection() {
      const [applications, setApplications] = useState([]);
      const [loading, setLoading] = useState(true);

      const STAGES = ['Applied', 'Resume Screening', 'Online Assessment (OA)', 'Technical Assessment', 'System Design', 'Offer Secured'];

      const fetchPipeline = async () => {
        try {
          const res = await fetch('/api/pipeline');
          const data = await res.json();
          setApplications(data);
        } catch (e) {
          console.error(e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchPipeline();

        const handleStudioMessage = async (event) => {
          if (event.data?.type === 'JOBINTEL_INTERVIEW_COMPLETE') {
            const { score, summary } = event.data.payload;
            await fetch('/api/pipeline/update-stage', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                candidateId: 'app-1',
                stage: 'System Design',
                score: score,
                feedback: summary
              })
            });
            fetchPipeline();
          }
        };

        window.addEventListener('message', handleStudioMessage);
        return () => window.removeEventListener('message', handleStudioMessage);
      }, []);

      const launchStudioPopup = (appId) => {
        const width = 1366;
        const height = 850;
        const left = Math.max(0, (window.screen.width - width) / 2);
        const top = Math.max(0, (window.screen.height - height) / 2);

        const features = `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no,location=no`;
        window.open('/interview-studio?candidateId=' + appId, 'JobIntelStudio', features);
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center pb-3 border-b border-slate-800">
            <div>
              <h2 className="text-xl font-bold text-slate-100">Live Recruitment Lifecycle & ATS Pipeline</h2>
              <p className="text-xs text-slate-400">Track candidates from initial screening and OA to WebRTC AI Technical Assessment</p>
            </div>
            <button
              onClick={fetchPipeline}
              className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono text-slate-300 flex items-center gap-2 cursor-pointer transition-all"
            >
              ↻ Refresh Stages
            </button>
          </div>

          {loading ? (
            <div className="text-center py-20 text-slate-500 font-mono text-sm">Loading stages...</div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-6 gap-3 overflow-x-auto min-w-[1200px]">
              {STAGES.map((stage) => {
                const stageCards = applications.filter(a => a.stage === stage);
                return (
                  <div key={stage} className="bg-slate-900/60 rounded-xl border border-slate-800/80 p-3.5 flex flex-col min-h-[520px]">
                    <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                      <span className="text-[11px] font-bold uppercase tracking-wider text-slate-300">{stage}</span>
                      <span className="text-[10px] font-mono font-bold bg-slate-800 px-2 py-0.5 rounded text-blue-400">
                        {stageCards.length}
                      </span>
                    </div>

                    <div className="space-y-3 flex-1">
                      {stageCards.map((card) => (
                        <div key={card.id} className="p-3.5 rounded-lg bg-slate-950 border border-slate-800/90 shadow-md flex flex-col justify-between">
                          <div>
                            <div className="flex items-center justify-between mb-1.5">
                              <span className="text-xs font-bold text-slate-200">{card.company}</span>
                              {card.ats_score > 0 && (
                                <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800/50">
                                  ATS: {card.ats_score}%

                            </div>
                            <div className="text-[11px] text-slate-400 mb-2 font-medium">{card.role}</div>
                            <p className="text-[10px] text-slate-500 mb-2 leading-relaxed">{card.feedback}</p>

                            )}
                          </div>

                          {card.stage === 'Technical Assessment' && (
                            <button
                              onClick={() => launchStudioPopup(card.id)}
                              className="w-full mt-2 py-2 px-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-[11px] font-bold uppercase tracking-wider rounded-lg shadow-lg shadow-blue-500/20 flex items-center justify-center gap-1.5 transition-all cursor-pointer"
                            >
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                              Launch AI Studio 🚀
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // --- TAB 5: STANDALONE SPLIT-SCREEN WEBRTC AI INTERVIEW STUDIO ---
    function StudioView() {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const audioContextRef = useRef(null);
      const animationFrameRef = useRef(null);

      const [hasStarted, setHasStarted] = useState(false);
      const [isAiSpeaking, setIsAiSpeaking] = useState(false);
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [activeQuestion, setActiveQuestion] = useState('Click "Start Technical Session" below to initialize video stream and AI interrogator.');
      const [candidateResponse, setCandidateResponse] = useState('');
      const [messages, setMessages] = useState([]);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isCompleted, setIsCompleted] = useState(false);

      useEffect(() => {
        async function initMedia() {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { width: 1280, height: 720 },
              audio: true
            });
            streamRef.current = stream;

            if (videoRef.current) {
              videoRef.current.srcObject = stream;
            }

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioContextRef.current = audioCtx;
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;
            source.connect(analyser);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const canvas = canvasRef.current;
            if (canvas) {
              const ctx = canvas.getContext('2d');
              const drawVisualizer = () => {
                animationFrameRef.current = requestAnimationFrame(drawVisualizer);
                analyser.getByteFrequencyData(dataArray);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const barWidth = (canvas.width / bufferLength) * 1.5;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                  const barHeight = (dataArray[i] / 255) * canvas.height;
                  ctx.fillStyle = '#06b6d4';
                  ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);
                  x += barWidth;
                }
              };
              drawVisualizer();
            }
          } catch (err) {
            console.warn('Webcam/Mic hardware stream not connected or denied:', err);
          }
        }

        initMedia();

        return () => {
          if (streamRef.current) streamRef.current.getTracks().forEach((track) => track.stop());
          if (audioContextRef.current) audioContextRef.current.close();
          if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
        };
      }, []);

      const speakText = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 0.95;
        utterance.onstart = () => setIsAiSpeaking(true);
        utterance.onend = () => setIsAiSpeaking(false);
        utterance.onerror = () => setIsAiSpeaking(false);
        window.speechSynthesis.speak(utterance);
      };

      const requestNextQuestion = async (userAnswer = '') => {
        setIsSubmitting(true);
        try {
          const response = await fetch('/api/interview/next-question', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              questionIndex: currentQuestionIndex,
              candidateAnswer: userAnswer,
              targetRole: 'Full-Stack Software Engineer (Python, React, WebRTC)'
            })
          });

          const data = await response.json();

          if (data.isFinished) {
            setIsCompleted(true);
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage({
                type: 'JOBINTEL_INTERVIEW_COMPLETE',
                payload: { score: data.finalScore, summary: data.evaluationSummary }
              }, '*');
            }
            return;
          }

          setActiveQuestion(data.question);
          setMessages((prev) => [
            ...prev,
            ...(userAnswer ? [{ sender: 'candidate', text: userAnswer }] : []),
            { sender: 'ai', text: data.question }
          ]);
          setCurrentQuestionIndex((prev) => prev + 1);
          speakText(data.question);
          setCandidateResponse('');
        } catch (err) {
          console.error(err);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleStartSession = () => {
        setHasStarted(true);
        requestNextQuestion('');
      };

      return (
        <div className="h-screen w-screen bg-slate-950 text-slate-100 flex flex-col font-sans overflow-hidden">
          <header className="h-14 border-b border-slate-800 bg-slate-900/90 px-6 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
              <span className="font-mono text-xs font-bold tracking-wider text-slate-200 uppercase">
                JobIntel Proctored Technical Studio
              </span>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-xs text-slate-400 font-mono">Candidate: Manvardhan Tripathi</span>
              <button
                onClick={() => window.close()}
                className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs transition-colors cursor-pointer"
              >
                Exit Studio
              </button>
            </div>
          </header>

          <div className="flex-1 grid grid-cols-12 overflow-hidden">
            <section className="col-span-7 p-5 border-r border-slate-800 flex flex-col justify-between bg-slate-950/60 overflow-y-auto">
              <div>
                <div className="relative rounded-xl overflow-hidden border border-slate-800 bg-black aspect-video flex items-center justify-center shadow-2xl">
                  <video
                    ref={videoRef}
                    autoPlay
                    playsInline
                    muted
                    className="w-full h-full object-cover transform -scale-x-100"
                  />
                  <div className="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md px-3 py-1 rounded text-[11px] text-emerald-400 border border-emerald-500/30 flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                    WebRTC HD Stream: Active
                  </div>
                  <div className="absolute bottom-3 left-3 flex items-center gap-2 bg-slate-950/80 backdrop-blur-md px-3 py-1 rounded border border-slate-800">
                    <span className="text-[10px] text-slate-400 font-mono">Mic Input:</span>
                    <canvas ref={canvasRef} width={80} height={16} className="rounded" />
                  </div>
                </div>

                <div className="mt-4 p-4 rounded-xl border border-slate-800 bg-slate-900/50">
                  <div className="flex justify-between items-center mb-2">
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                      Technical Architecture & Code Explanation
                    </label>
                    <span className="text-[11px] text-slate-500 font-mono">Candidate Input</span>
                  </div>
                  <textarea
                    value={candidateResponse}
                    onChange={(e) => setCandidateResponse(e.target.value)}
                    disabled={!hasStarted || isCompleted}
                    placeholder="Explain architectural tradeoffs, WebRTC connection states, or database queries..."
                    className="w-full h-28 bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs focus:outline-none focus:border-cyan-500 resize-none text-slate-200 font-mono"
                  />
                </div>
              </div>

              <div className="flex justify-between items-center mt-3">
                <span className="text-[11px] text-slate-500">
                  {hasStarted ? `Question ${currentQuestionIndex} in progress` : 'Ready to start'}
                </span>
                {hasStarted && !isCompleted && (
                  <button
                    disabled={isSubmitting || !candidateResponse.trim()}
                    onClick={() => requestNextQuestion(candidateResponse)}
                    className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white rounded-lg text-xs font-semibold tracking-wider transition-all cursor-pointer"
                  >
                    {isSubmitting ? 'Evaluating...' : 'Submit Technical Answer ➔'}
                  </button>
                )}
              </div>
            </section>

            <section className="col-span-5 p-5 flex flex-col bg-slate-900/20">
              <div className="flex items-center justify-between pb-3 border-b border-slate-800/80">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400">AI Assessment Panel</h2>
                {isAiSpeaking && (
                  <span className="text-[11px] font-mono text-cyan-400 animate-pulse flex items-center gap-1">
                    <span>🔊</span> Interrogator Speaking...
                  </span>
                )}
              </div>

              <div className="mt-4 p-4 rounded-xl border border-cyan-500/30 bg-cyan-950/20 shadow-lg">
                <div className="text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-1 font-mono">
                  Active Challenge
                </div>
                <p className="text-sm font-medium text-slate-100 leading-relaxed">{activeQuestion}</p>
              </div>

              <div className="flex-1 overflow-y-auto my-4 space-y-3 pr-2 scrollbar-thin">
                {messages.map((item, idx) => (
                  <div
                    key={idx}
                    className={`p-3 rounded-lg text-xs leading-relaxed ${
                      item.sender === 'ai'
                        ? 'bg-slate-800/80 text-slate-200 border border-slate-700/60'
                        : 'bg-blue-950/50 text-blue-200 border border-blue-900/60 ml-6'
                    }`}
                  >
                    <div className="text-[9px] font-bold uppercase tracking-wider opacity-60 mb-1">
                      {item.sender === 'ai' ? 'Autonomous AI Interrogator' : 'Candidate'}
                    </div>
                    {item.text}
                  </div>
                ))}
              </div>

              {!hasStarted && (
                <button
                  onClick={handleStartSession}
                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-xs uppercase tracking-wider shadow-lg shadow-blue-500/20 transition-all cursor-pointer"
                >
                  Start Technical Session
                </button>
              )}

              {isCompleted && (
                <div className="p-4 rounded-xl border border-emerald-500/40 bg-emerald-950/20 text-center">
                  <div className="text-emerald-400 font-bold text-sm mb-1">Assessment Complete</div>
                  <p className="text-xs text-slate-300 mb-3">Score: 92/100 • Advanced to System Design</p>
                  <button
                    onClick={() => window.close()}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold cursor-pointer"
                  >
                    Close Studio & View Pipeline
                  </button>
                </div>
              )}
            </section>
          </div>
        </div>
      );
    }

    // --- MAIN NAVIGATION CONTAINER ---
    function App() {
      const isStudioRoute = window.location.pathname.includes('interview-studio');
      const [activeTab, setActiveTab] = useState('pipeline'); // 'jobs', 'pipeline', 'ats-checker', 'resume-builder'

      if (isStudioRoute) {
        return <StudioView />;
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 font-sans">
          {/* Main Top Header */}
          <header className="h-16 border-b border-slate-800 bg-slate-900/90 px-8 flex items-center justify-between sticky top-0 z-50 backdrop-blur-md">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-bold font-mono text-white text-lg shadow-md shadow-blue-500/30">
                JI
              </div>
              <div>
                <h1 className="font-bold text-base text-slate-100 flex items-center gap-2">
                  JobIntel Pro Suite <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800">Complete ATS Ecosystem</span>
                </h1>
                <p className="text-xs text-slate-400">Jobs Apply • ATS Scanner • Resume Builder • Kanban Pipeline • AI Interview Studio</p>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="text-right">
                <div className="text-xs font-semibold text-slate-200">Manvardhan Tripathi</div>
                <div className="text-[11px] text-emerald-400 font-mono">B.Tech CSE '26 @ MMMUT</div>
              </div>
              <div className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-bold text-blue-400">
                MT
              </div>
            </div>
          </header>

          {/* Navigation Tabs */}
          <nav className="border-b border-slate-800 bg-slate-900/40 px-8 flex gap-6 text-xs font-medium uppercase tracking-wider">
            <button
              onClick={() => setActiveTab('jobs')}
              className={`py-3.5 border-b-2 transition-all cursor-pointer flex items-center gap-2 ${
                activeTab === 'jobs' ? 'border-blue-500 text-blue-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              💼 Verified Jobs
            </button>
            <button
              onClick={() => setActiveTab('pipeline')}
              className={`py-3.5 border-b-2 transition-all cursor-pointer flex items-center gap-2 ${
                activeTab === 'pipeline' ? 'border-blue-500 text-blue-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              📌 Recruitment Lifecycle (6 Stages)
            </button>
            <button
              onClick={() => setActiveTab('ats-checker')}
              className={`py-3.5 border-b-2 transition-all cursor-pointer flex items-center gap-2 ${
                activeTab === 'ats-checker' ? 'border-blue-500 text-blue-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              📊 ATS Resume Checker
            </button>
            <button
              onClick={() => setActiveTab('resume-builder')}
              className={`py-3.5 border-b-2 transition-all cursor-pointer flex items-center gap-2 ${
                activeTab === 'resume-builder' ? 'border-blue-500 text-blue-400 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'
              }`}
            >
              📝 ATS Resume Maker
            </button>
          </nav>

          {/* Body Content */}
          <main className="flex-1 p-8">
            {activeTab === 'jobs' && <JobBoardSection onApplySuccess={() => setActiveTab('pipeline')} />}
            {activeTab === 'pipeline' && <PipelineSection />}
            {activeTab === 'ats-checker' && <AtsCheckerSection />}
            {activeTab === 'resume-builder' && <ResumeBuilderSection />}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
